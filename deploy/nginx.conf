# Load balancer in front of several API instances. Any instance can serve any request: auth
# cache, rate limits and the ingestion queue live in Redis, nothing lives in process memory.
#
#   nginx -p "$PWD" -c deploy/nginx.conf          (instances on :4001-4003, balancer on :4000)
#
# On a managed host (Render, Fly, Cloud Run, an AWS ALB) the platform's own balancer replaces
# this file; scale by instance count. Each instance holds DATABASE_URL's pool, so run through
# the transaction pooler (DB_POOL_MODE=transaction) once instances x pool exceeds ~15.
worker_processes auto;
pid /tmp/adigam-nginx.pid;
error_log /tmp/adigam-nginx-error.log warn;
events { worker_connections 8192; }

http {
    access_log off;

    upstream adigam_api {
        least_conn;                      # long AI calls shouldn't pile onto one instance
        server 127.0.0.1:4001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:4002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:4003 max_fails=3 fail_timeout=10s;
        keepalive 256;
    }

    server {
        listen 4000;
        client_max_body_size 41m;        # 40 MB uploads
        proxy_read_timeout 180s;         # AI answers can take 90 s

        location / {
            proxy_pass http://adigam_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # An instance that dies mid-request: retry idempotent requests on another one.
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
