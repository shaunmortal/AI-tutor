<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Adigam AI — Adaptive Learning</title>
        <meta name="theme-color" content="#e8eefa" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <!--
      Applies the saved theme before the first paint, so there is no flash of the wrong palette.
      Day (light) unless the learner chose night, or chose "match device" on a dark device.
      try/catch: localStorage throws in some private windows, and a themed page isn't worth a blank one.
    -->
        <script>
            try {
                // ?theme=dark|light picks a theme from a link (handy for demos) and remembers it.
                var asked = new URLSearchParams(location.search).get('theme');
                if (asked === 'dark' || asked === 'light') localStorage.setItem('adigam-theme', asked);
                var saved = localStorage.getItem('adigam-theme');
                var dark =
                    saved === 'dark' ||
                    (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
