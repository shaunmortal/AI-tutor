# Render blueprint: the Go API and the Redis it needs.
#
# Secrets are not here: `sync: false` makes Render ask for each value once and store it encrypted.
# Region: Singapore is Render's closest to Supabase's Mumbai region; every query pays that round
# trip, so keep the API and the database as close together as the platforms allow.
services:
    - type: web
      name: adigam-api
      runtime: go
      plan: free
      region: singapore
      rootDir: server
      buildCommand: go build -trimpath -ldflags="-s -w" -o api ./cmd/api
      startCommand: ./api
      # The health check stays off on the free plan: with one instance, a single slow check
      # takes the whole service out of rotation. /api/v1/health/deep is there for monitors.
      envVars:
          - key: PORT
            value: 10000
          - key: CORS_ORIGINS
            value: https://adigamai.vercel.app,http://localhost:5173
          - key: REDIS_URL
            fromService:
                type: keyvalue
                name: adigam-redis
                property: connectionString
          # Transaction pooler (:6543) so several instances can share the database's connections.
          - key: DB_POOL_MODE
            value: transaction
          - key: SUPABASE_URL
            sync: false
          - key: SUPABASE_PUBLISHABLE_KEY
            sync: false
          - key: SUPABASE_SECRET_KEY
            sync: false
          - key: DATABASE_URL
            sync: false
          - key: ANTHROPIC_API_KEY
            sync: false

    # Auth cache, per-learner rate limits and the durable ingestion queue (Redis Streams).
    - type: keyvalue
      name: adigam-redis
      plan: free
      region: singapore
      # Queue entries must survive memory pressure, so nothing is evicted.
      maxmemoryPolicy: noeviction
      ipAllowList: []
